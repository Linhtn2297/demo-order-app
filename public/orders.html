<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注文一覧 | 受注管理システム</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <h1>注文一覧</h1>
    <span id="current-user"></span>
    <button id="logout" type="button">ログアウト</button>
  </header>
  <main>
    <form id="search-form" class="search">
      <label>顧客名 <input name="customerName"></label>
      <label>注文日 <input name="dateFrom" type="date"> 〜 <input name="dateTo" type="date"></label>
      <label>ステータス
        <select name="status">
          <option value="">すべて</option>
          <option value="draft">下書き</option>
          <option value="confirmed">確定</option>
          <option value="shipped">出荷済</option>
        </select>
      </label>
      <button type="submit">検索</button>
      <button id="new-order" type="button" hidden>新規作成</button>
    </form>
    <p id="result-count"></p>
    <table>
      <thead>
        <tr><th>注文番号</th><th>注文日</th><th>顧客名</th><th>合計金額</th><th>ステータス</th><th>操作</th></tr>
      </thead>
      <tbody id="order-rows"></tbody>
    </table>
  </main>
  <script type="module" src="/orders.js"></script>
</body>
</html>
